<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vietnamese Glyph Test</title>
<!-- Open in a browser (or screenshot with Playwright) to check stacked diacritics
     for clipping or collisions at each line-height. Edit FONTS to test others. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&family=Inter:wght@400;600&family=Montserrat:wght@400;600;700&display=swap&subset=vietnamese" rel="stylesheet">
<style>
  :root { --bg: #ffffff; --fg: #1b1f23; --muted: #5c656e; --line: #dde1e5; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0d0f11; --fg: #f7f8f9; --muted: #c3c9cf; --line: #2d3339; } }
  :root[data-theme="dark"] { --bg: #0d0f11; --fg: #f7f8f9; --muted: #c3c9cf; --line: #2d3339; }
  body { background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: 16px; }
  h1 { font-size: 1.25rem; }
  section { border-top: 1px solid var(--line); padding: 12px 0; }
  .meta { color: var(--muted); font-size: 0.875rem; }
  .sample { font-size: 1.5rem; margin: 4px 0; outline: 1px dashed var(--line); overflow-wrap: anywhere; }
</style>
</head>
<body>
<h1>Kiểm tra dấu tiếng Việt</h1>
<p class="meta">Look for marks that touch the line above, clip at the top, or merge with descenders (ỵ, ỹ, Ự). Each box is one line box.</p>
<div id="out"></div>
<script>
  const FONTS = ['Montserrat', 'Be Vietnam Pro', 'Inter'];
  const HEIGHTS = [1.0, 1.15, 1.3, 1.5];
  const TEXT = 'ẪỄỖẲỰẬ Ống Ỷ Ữ — Nguyễn Thị Ánh Tuyết, Trường Sơn<br>ỹ ỵ gặp Quỳnh ở phòng khám — Hẹn tái khám thứ Bảy';
  const out = document.getElementById('out');
  for (const f of FONTS) {
    const s = document.createElement('section');
    s.innerHTML = `<strong>${f}</strong>` + HEIGHTS.map(h =>
      `<div class="meta">line-height ${h}</div><p class="sample" style="font-family:'${f}';line-height:${h}">${TEXT}</p>`).join('');
    out.appendChild(s);
  }
</script>
</body>
</html>
