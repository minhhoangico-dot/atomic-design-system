<!doctype html>
<html lang="vi" data-theme="clinic">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đặt lịch khám — Phòng khám Bác sĩ Gia đình</title>
<link rel="stylesheet" href="tokens.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--text-default); font-family: var(--font-body); font-size: 1.125rem; line-height: 1.55; }
  h1, h2 { font-family: var(--font-heading); line-height: 1.3; margin: 0; }
  a, button { outline: none; }
  main { max-width: var(--container-max); margin: 0 auto; padding: var(--space-20); display: grid; gap: var(--space-20); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg, 12px); box-shadow: 0 2px 8px rgb(0 0 0 / 0.08); padding: var(--space-20); display: grid; gap: var(--space-15); }
  .hotline { display: flex; gap: var(--space-15); white-space: nowrap; min-width: 26rem; align-items: center; color: var(--hotline); font-weight: 600; }
  .hotline a { color: inherit; }
  .slots { display: flex; flex-wrap: wrap; gap: var(--space-10); }
  .slot { height: 2.25rem; min-width: 4.5rem; padding: 0 var(--space-10); border: 1px solid var(--border-control); border-radius: var(--radius-md, 8px); background: var(--surface); color: var(--text-default); font: inherit; cursor: pointer; }
  .slot[aria-pressed="true"] { background: var(--action-primary-bg); color: var(--text-on-action); border-color: var(--action-primary-bg); }
  .slot:disabled { color: var(--ink-subtle); background: var(--surface-alt); text-decoration: line-through; cursor: not-allowed; }
  .primary { min-height: var(--control-height); padding: 0 var(--space-30); border: 0; border-radius: var(--radius-md, 8px); background: var(--action-primary-bg); color: var(--text-on-action); font: inherit; font-weight: 600; cursor: pointer; justify-self: start; }
  .primary:hover { background: var(--action-primary-bg-hover); }
  .back { color: var(--text-link); min-height: var(--target-min); display: inline-flex; align-items: center; }
</style>
</head>
<body>
<header class="card" style="border-radius:0">
  <div class="hotline"><span>Cần giúp? Gọi tổng đài</span><a href="tel:02435430430">024 35 430 430</a></div>
</header>
<main>
  <a class="back" href="#">Quay lại</a>
  <h1>Chọn giờ khám</h1>
  <section class="card" aria-labelledby="day">
    <h2 id="day">Thứ Bảy, 24 tháng 10, 2026</h2>
    <div class="card">
      <p style="margin:0">Khám đa khoa · Bác sĩ Nguyễn Thị Lan</p>
      <div class="card">
        <div class="slots" role="group" aria-label="Giờ còn trống buổi sáng">
          <button class="slot" type="button" aria-pressed="false">08:00</button>
          <button class="slot" type="button" disabled>08:30</button>
          <button class="slot" type="button" aria-pressed="true">09:00</button>
          <button class="slot" type="button" aria-pressed="false">09:30</button>
          <button class="slot" type="button" disabled>10:00</button>
          <button class="slot" type="button" aria-pressed="false">10:30</button>
        </div>
      </div>
    </div>
  </section>
  <button class="primary" type="button">Tiếp tục</button>
</main>
<script>
  document.querySelectorAll('.slot:not(:disabled)').forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll('.slot').forEach((o) => o.setAttribute('aria-pressed', String(o === b)));
  }));
</script>
</body>
</html>
