schema_version: "1.1"
name: tokens-for-new-brand
expected_outcome: |
  A tokens.css with primitive color ramps and intent-named semantic tokens, a dark theme
  that re-declares semantic tokens, and accessible choices: white text is never placed on
  the raw teal #00A6A6 (3.0:1) or orange #F5A623 (2.0:1); buttons use a darker teal step
  (about #008484 or darker) or dark text; contrast ratios are reported from a calculation.
